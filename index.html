<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Tray Table Playmat</title>

<!-- installs to the home screen and launches without browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Playmat">
<meta name="theme-color" content="#F2FAFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A27" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* the few rules the artifact host normally supplies */
html{height:100%; box-sizing:border-box; color-scheme:light dark;
     padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; height:100%}
img{max-width:100%}
[hidden]{display:none !important}
</style>
</head>
<body>
<style>
:root{
  --paper:#F0FBFF; --mat:#CCEDFC; --card:#FFFFFF; --card-edge:#C2DDEB;
  --ink:#223049; --ink-soft:#5E7290; --line:#B9D7E6; --pip-off:#BFD9E7;
  --on-color:#1B2435;
  --veil:rgba(34,48,73,.45);
  /* Bright toy colours. Every one of them carries --on-color (dark ink)
     at well over 4.5:1, because nothing here is ever white-on-a-colour. */
  --tomato:#FF5A47; --tomato-e:#D1382A;
  --sun:#FFCC1A;    --sun-e:#D9A000;
  --grass:#35DC7C;  --grass-e:#1BA355;
  --grape:#B37DFF;  --grape-e:#7B42DE;
  --bubble:#FF7ACB; --bubble-e:#D94BA2;
  --sky:#3FC6FF;    --sky-e:#1A8ECC;
  --tangerine:#FFA030; --tangerine-e:#D97413;
  --teal:#2BE3CA;   --teal-e:#12A994;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121B2B; --mat:#1F2C40; --card:#29344A; --card-edge:#141C29;
    --ink:#F0F5FB; --ink-soft:#A4B5CD; --line:#3C4A63; --pip-off:#44536E;
    --veil:rgba(8,12,20,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#121B2B; --mat:#1F2C40; --card:#29344A; --card-edge:#141C29;
  --ink:#F0F5FB; --ink-soft:#A4B5CD; --line:#3C4A63; --pip-off:#44536E;
  --veil:rgba(8,12,20,.6);
}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,"Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; overscroll-behavior:none; overflow:hidden;
}
#app{height:100%; display:flex; flex-direction:column; min-height:0}
#bar{display:flex; align-items:center; gap:8px; padding:10px 16px 6px; flex:0 0 auto}
#stage{flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; padding:0 16px 16px}

.brand{font-size:19px; font-weight:800; letter-spacing:-.01em; margin-right:auto}
.brand b{color:var(--sky-e); font-weight:800}
.kicker{font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}

/* chunky toy button: a solid bottom edge that compresses when pressed */
.chunk{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  background:var(--c,var(--card)); color:var(--on-color);
  border-radius:20px; box-shadow:0 6px 0 var(--ce,var(--card-edge));
  transition:transform .07s ease, box-shadow .07s ease;
}
.chunk.plain{color:var(--ink)}
.chunk:active{transform:translateY(5px); box-shadow:0 1px 0 var(--ce,var(--card-edge))}
.chunk:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.mini{min-width:46px; height:46px; border-radius:15px; box-shadow:0 4px 0 var(--ce,var(--card-edge)); font-size:20px; display:grid; place-items:center; padding:0 10px}
.mini:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ce,var(--card-edge))}
.seg{display:flex; gap:5px; align-items:center}
.pill{min-width:40px; height:40px; border-radius:13px; font-size:17px; font-weight:800; box-shadow:0 4px 0 var(--ce,var(--card-edge)); display:grid; place-items:center}
.pill[aria-pressed="true"]{--c:var(--sun); --ce:var(--sun-e)}
.pill:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ce,var(--card-edge))}

/* home play mat */
.mat{flex:1; min-height:0; overflow-y:auto; display:grid; gap:12px; grid-template-columns:repeat(2,1fr); align-content:start; padding-bottom:4px}
@media (min-width:620px){.mat{grid-template-columns:repeat(3,1fr)}}
.tile{min-height:116px; display:grid; place-content:center; gap:4px; padding:12px 8px; text-align:center}
.tile .ticon{font-size:clamp(38px,9vw,54px); line-height:1.05}
.tile .tname{font-size:15px; font-weight:800}
.hint-line{font-size:13px; color:var(--ink-soft); text-align:center; padding:2px 0 0}

/* game chrome */
.pips{display:flex; gap:6px; margin-left:auto}
.pip{width:13px; height:13px; border-radius:50%; background:var(--pip-off)}
.pip.on{background:var(--sun); box-shadow:inset 0 -3px 0 var(--sun-e)}
.gname{font-size:16px; font-weight:800}

.prompt{
  flex:0 0 auto; background:var(--card); color:var(--ink); border-radius:22px;
  box-shadow:0 5px 0 var(--card-edge); padding:12px 16px; min-height:86px;
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; cursor:pointer;
}
.prompt .big{font-size:clamp(40px,11vw,68px); line-height:1}
.prompt .num{font-size:clamp(44px,12vw,76px); font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.prompt .ptext{font-size:15px; font-weight:700; color:var(--ink-soft)}
.dots{display:flex; gap:7px}
.dot{width:17px; height:17px; border-radius:50%; border:3px solid var(--line)}
.dot.on{background:var(--grass); border-color:var(--grass-e)}

.play{flex:1; min-height:0; display:grid; place-content:center; align-content:center; gap:12px}
.play.fill{place-content:stretch; align-content:stretch}
.grid{display:grid; gap:12px; width:100%}
.opt{aspect-ratio:1; display:grid; place-items:center; font-size:clamp(32px,9.5vw,58px); max-height:30vh}
.opt.numeric{font-size:clamp(34px,10vw,62px); font-weight:800; font-variant-numeric:tabular-nums}
.row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}

@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-5deg)}40%{transform:translateX(9px) rotate(5deg)}60%{transform:translateX(-6px) rotate(-3deg)}80%{transform:translateX(6px) rotate(3deg)}}
.wob{animation:wob .42s ease}
@keyframes popout{to{transform:scale(0) rotate(25deg); opacity:0}}
.gone{animation:popout .3s ease forwards; pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px)}}
.bob{animation:bob .75s ease-in-out infinite}

/* balloons */
.sky{position:relative; flex:1; min-height:0; overflow:hidden; border-radius:24px; background:var(--mat)}
.bal{
  position:absolute; top:0; left:0; width:var(--w); height:calc(var(--w) * 1.16);
  border-radius:50% 50% 46% 46%; border:0; padding:0; cursor:pointer;
  display:grid; place-items:center; font:inherit; font-weight:800; color:var(--on-color);
  font-size:calc(var(--w) * .42); will-change:transform;
}
.bal::before{content:""; position:absolute; top:13%; left:17%; width:26%; height:19%; border-radius:50%; background:rgba(255,255,255,.55)}
.bal::after{content:""; position:absolute; bottom:-8px; left:50%; margin-left:-7px; width:14px; height:11px; background:inherit; clip-path:polygon(50% 0,100% 100%,0 100%)}

/* memory */
.card3d{aspect-ratio:1; display:grid; place-items:center; font-size:clamp(28px,8.5vw,52px); border-radius:18px; max-height:26vh}
.card3d.down{color:rgba(27,36,53,.45); font-weight:800}

/* sticker book */
.book{flex:1; min-height:0; overflow-y:auto; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(68px,1fr)); align-content:start}
.slot{aspect-ratio:1; border-radius:18px; border:3px dashed var(--line); display:grid; place-items:center; font-size:clamp(28px,7vw,40px)}
.slot.has{border:0; background:var(--card); box-shadow:0 4px 0 var(--card-edge)}

/* doodle */
.pad{flex:1; min-height:0; width:100%; display:block; background:#fff; border-radius:24px; box-shadow:0 5px 0 var(--card-edge); touch-action:none}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center}
.swatch{width:44px; height:44px; border-radius:50%; border:0; padding:0; cursor:pointer; box-shadow:0 4px 0 rgba(27,36,53,.28)}
.swatch[aria-pressed="true"]{outline:4px solid var(--ink); outline-offset:3px}
.stamp{width:44px; height:44px; border-radius:15px; font-size:24px; display:grid; place-items:center; box-shadow:0 4px 0 var(--card-edge)}
.stamp[aria-pressed="true"]{outline:4px solid var(--ink); outline-offset:3px}

/* celebration */
#confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.cf{position:absolute; top:-30px; width:13px; height:17px; border-radius:3px}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.cheer{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px; background:var(--veil)}
.cheer-card{background:var(--card); color:var(--ink); border-radius:28px; box-shadow:0 8px 0 var(--card-edge); padding:24px 20px; text-align:center; width:100%; max-width:340px}
.cheer-card .won{font-size:84px; line-height:1}
.cheer-card h2{margin:6px 0 2px; font-size:24px}
.cheer-card p{margin:0 0 16px; font-size:14px; color:var(--ink-soft)}
.cheer-card .row .chunk{min-width:78px; height:58px; font-size:26px; display:grid; place-items:center}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  .chunk{transition:none}
}
</style>

<div id="app">
  <header id="bar"></header>
  <main id="stage"></main>
</div>
<div id="confetti" aria-hidden="true"></div>

<script>
(function(){
"use strict";

var bar = document.getElementById('bar');
var stage = document.getElementById('stage');
var confettiBox = document.getElementById('confetti');

var STICKERS = ['🌟','🦄','🐙','🍉','🚀','🐝','🌈','🦖','🐸','🍦','🐠','🎈','🧸','🦋','🐳','🍄','🐥','🌻','🦔','🐢','🍒','🎸','🦩','🐲'];
var HUES = ['tomato','sun','grass','grape','bubble','sky','tangerine','teal'];

var GAMES = [
  {id:'letters',    name:'A is for…',    icon:'🅰️', c:'grape', rounds:5, kind:'learn', minAge:5},
  {id:'howmany',    name:'How Many?',      icon:'🔢', c:'grass',     rounds:5, kind:'learn'},
  {id:'monster',    name:'Feed Me',        icon:'👾', c:'teal',      rounds:4, kind:'learn'},
  {id:'more',       name:'Which Is More',  icon:'⚖️', c:'sun',     rounds:5, kind:'learn'},
  {id:'hunt',       name:'Find It',        icon:'🔤', c:'sky',       rounds:5, kind:'learn'},
  {id:'startswith', name:'Starts With',    icon:'👂', c:'grape',     rounds:5, kind:'learn'},
  {id:'train',      name:'Train',          icon:'🚂', c:'tangerine', rounds:5, kind:'learn'},
  {id:'samekind',   name:"Doesn't Belong", icon:'🧩', c:'bubble',    rounds:5, kind:'learn'},
  {id:'tune',       name:'Copy the Tune',  icon:'🎵', c:'grape', rounds:4, kind:'play'},
  {id:'dots',       name:'Dot to Dot',     icon:'✏️', c:'sky',   rounds:3, kind:'learn'},
  {id:'sizes',      name:'Big to Small',   icon:'📏', c:'teal',  rounds:4, kind:'learn'},
  {id:'rhyme',      name:'Rhyme Time',     icon:'🎤', c:'grape', rounds:5, kind:'learn', minAge:5},
  {id:'changed',    name:'What Changed?',  icon:'👀', c:'sun',       rounds:5, kind:'play'},
  {id:'maze',       name:'Find the Way',   icon:'🗺️', c:'tangerine', rounds:3, kind:'play'},
  {id:'balloons',   name:'Pop',            icon:'🎈', c:'tomato',    rounds:3, kind:'play'},
  {id:'memory',     name:'Match',          icon:'🐼', c:'grape',     rounds:3, kind:'play'},
  {id:'different',  name:'Not the Same',   icon:'🔍', c:'teal',      rounds:5, kind:'play'},
  {id:'mancala',    name:'Mancala',        icon:'🫘', c:'tangerine', rounds:1, kind:'play'},
  {id:'colour',     name:'Coloring Book',  icon:'🎨', c:'sky', rounds:0, kind:'play'},
  {id:'doodle',     name:'Doodle',         icon:'🖍️', c:'bubble', rounds:0, kind:'play'}
];

/* Flip the two ages here if they are the wrong way round. */
var KIDS = [
  {id:'juniper', name:'Juniper', icon:'\ud83d\udc78', hue:'bubble', age:3},
  {id:'francis', name:'Francis', icon:'\ud83e\uddcc', hue:'grass',  age:5}
];
function kid(){
  for(var i=0;i<KIDS.length;i++) if(KIDS[i].id === state.player) return KIDS[i];
  return KIDS[0];
}
/* state.age is derived from whoever is playing, so every game reads one thing. */
function setPlayer(id){
  state.player = id;
  state.age = kid().age;
  save();
}
function book(){
  if(!state.books[state.player]) state.books[state.player] = [];
  return state.books[state.player];
}
function wall(){
  if(!state.walls[state.player]) state.walls[state.player] = [];
  return state.walls[state.player];
}

/* Hangs the canvas on the wall as a small picture. Full-size canvases are far
   too big for the browser's little storage box, so it is scaled down first. */
function hangUp(cv){
  try{
    var w = 520, h = Math.max(1, Math.round(w * cv.height / cv.width));
    var shot = document.createElement('canvas');
    shot.width = w; shot.height = h;
    var sc = shot.getContext('2d');
    sc.fillStyle = '#fff';
    sc.fillRect(0, 0, w, h);
    sc.drawImage(cv, 0, 0, w, h);
    var mine = wall();
    mine.push(shot.toDataURL('image/jpeg', 0.72));
    if(mine.length > 12) mine.shift();
    save();
    return true;
  }catch(e){ return false; }
}

var state = {player:null, age:3, sound:true, books:{}, walls:{}};
try{
  var saved = localStorage.getItem('playmat');
  if(saved){
    var s = JSON.parse(saved);
    if(s && typeof s.sound === 'boolean') state.sound = s.sound;
    if(s && s.books && typeof s.books === 'object') state.books = s.books;
    if(s && s.walls && typeof s.walls === 'object') state.walls = s.walls;
    if(s && Array.isArray(s.stickers) && !s.books) state.books = {juniper:s.stickers.slice(0,24)};
    if(s && s.player) setPlayerQuietly(s.player);
  }
}catch(e){}
function setPlayerQuietly(id){
  for(var i=0;i<KIDS.length;i++) if(KIDS[i].id === id){ state.player = id; state.age = KIDS[i].age; }
}
function save(){
  try{
    localStorage.setItem('playmat', JSON.stringify(state));
  }catch(e){
    /* out of room: take the oldest pictures down until it fits */
    for(var tries=0; tries<24; tries++){
      var dropped = false;
      for(var id in state.walls){
        if(state.walls[id] && state.walls[id].length){ state.walls[id].shift(); dropped = true; break; }
      }
      if(!dropped) return;
      try{ localStorage.setItem('playmat', JSON.stringify(state)); return; }catch(e2){}
    }
  }
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
}
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function chunk(hue, cls, html){
  var b = el('button', 'chunk' + (cls ? ' '+cls : ''), html);
  b.type = 'button';
  if(hue){ b.style.setProperty('--c','var(--'+hue+')'); b.style.setProperty('--ce','var(--'+hue+'-e)'); }
  else b.classList.add('plain');
  return b;
}
function gameById(id){
  for(var i=0;i<GAMES.length;i++) if(GAMES[i].id===id) return GAMES[i];
  return GAMES[0];
}

/* ---------- sound: short soft tones, no files to download ---------- */
var ac = null;
function tone(freq, dur, type, gain){
  if(!state.sound) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!ac) ac = new AC();
    if(ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(ac.destination);
    var t = ac.currentTime, peak = gain || 0.1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
var sfx = {
  tap:  function(){ tone(640, 0.11, 'triangle', 0.1); },
  pop:  function(){ tone(880, 0.1, 'triangle', 0.13); setTimeout(function(){ tone(1180, 0.08, 'sine', 0.07); }, 55); },
  good: function(){
    /* a different little tune each time, so five rounds don't grate */
    var jingles = [[523,659,784],[587,740,880],[659,784,988],[523,784,1047],[440,554,659,880],[698,880,1047]];
    var tune = jingles[rnd(jingles.length)];
    for(var i=0;i<tune.length;i++){
      (function(f, n){ setTimeout(function(){ tone(f, 0.19, 'triangle', 0.11); }, n*95); })(tune[i], i);
    }
  },
  nope: function(){ tone(196, 0.16, 'sine', 0.07); },
  win:  function(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f, 0.22, 'triangle', 0.1); }, i*115); }); }
};
/* system voices are on the device, so this works with no signal */
function say(text){
  if(!state.sound || !text) return;
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.15; u.volume = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

function confetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(var i=0;i<26;i++){
    var p = el('div','cf');
    p.style.left = rnd(100) + 'vw';
    p.style.background = 'var(--' + HUES[rnd(HUES.length)] + ')';
    p.style.animation = 'fall ' + (1.1 + Math.random()*0.8).toFixed(2) + 's linear ' + (Math.random()*0.35).toFixed(2) + 's forwards';
    confettiBox.appendChild(p);
  }
  setTimeout(function(){ confettiBox.innerHTML = ''; }, 2600);
}

/* ---------- top bar ---------- */
function soundButton(){
  var b = chunk(state.sound ? 'sun' : null, 'mini', state.sound ? '🔔' : '🔇');
  b.setAttribute('aria-label', state.sound ? 'Sound on' : 'Sound off');
  b.onclick = function(){
    state.sound = !state.sound;
    save();
    if(!state.sound){ try{ speechSynthesis.cancel(); }catch(e){} }
    b.innerHTML = state.sound ? '🔔' : '🔇';
    b.setAttribute('aria-label', state.sound ? 'Sound on' : 'Sound off');
    if(state.sound){ b.style.setProperty('--c','var(--sun)'); b.style.setProperty('--ce','var(--sun-e)'); b.classList.remove('plain'); sfx.tap(); }
    else { b.style.removeProperty('--c'); b.style.removeProperty('--ce'); b.classList.add('plain'); }
  };
  return b;
}
function homeBar(){
  bar.innerHTML = '';
  bar.appendChild(el('div','brand','tray table <b>playmat</b>'));
  var k = kid();
  var who = chunk(k.hue, 'who',
    '<span class="wicon">' + k.icon + '</span><span class="wname">' + k.name + '</span>');
  who.setAttribute('aria-label', 'Playing as ' + k.name + '. Tap to switch.');
  who.onclick = function(){ sfx.tap(); renderPicker(); };
  bar.appendChild(who);
  bar.appendChild(soundButton());
}

/* The opening screen: one big button each. */
function renderPicker(){
  try{ speechSynthesis.cancel(); }catch(e){}
  bar.innerHTML = '';
  bar.appendChild(el('div','brand','tray table <b>playmat</b>'));
  bar.appendChild(soundButton());
  stage.innerHTML = '';
  var wrap = el('div','picker');
  KIDS.forEach(function(k){
    var b = chunk(k.hue, 'kid',
      '<span class="kicon">' + k.icon + '</span><span class="kname">' + k.name + '</span>');
    b.setAttribute('aria-label', k.name);
    b.onclick = function(){
      sfx.tap();
      setPlayer(k.id);
      renderHome();
      say('Hello ' + k.name);
    };
    wrap.appendChild(b);
  });
  stage.appendChild(wrap);
  stage.appendChild(el('p','hint-line','Who is playing?'));
  say('Who is playing?');
}
function gameBar(g, done){
  bar.innerHTML = '';
  var back = chunk('sun','homebtn','<span class="hicon">🏠</span><span class="htext">home</span>');
  back.setAttribute('aria-label','Back to all games');
  back.onclick = function(){ sfx.tap(); renderHome(); };
  bar.appendChild(back);
  bar.appendChild(el('div','gname', g.name));
  if(g.rounds > 0){
    var pips = el('div','pips');
    for(var i=0;i<g.rounds;i++) pips.appendChild(el('div','pip' + (i < done ? ' on' : '')));
    bar.appendChild(pips);
  } else {

  var done = 0, lastSpeech = '';

      lastSpeech = speech || '';
      say(lastSpeech);
    },
    promptHTML: function(html){ promptEl.innerHTML = html; },
    nope: function(node){
      sfx.nope();
      node.classList.remove('wob');

      node.classList.add('wob');

      return false;
    },
    raf: function(id){ liveRaf = id; }
  };
  BUILD[g.id](api, g);
}

/* ---------- 1. balloon pop: tap counting, then counting in order ---------- */
BUILD.balloons = function(api){
  var ordered = state.age === 5;
  var n = ordered ? 8 : 4;
  var w = ordered ? 60 : 88;
  api.play.className = 'play fill';
  var sky = el('div','sky');
  api.play.appendChild(sky);
  var bals = [], want = 1, raf = 0, last = 0;

  function ask(){
    if(ordered) api.prompt('<span class="num">' + want + '</span><span class="ptext">pop this number</span>', 'Pop number ' + want);
    else api.prompt('<span class="big">🎈</span><span class="ptext">pop them all</span>', 'Pop all the balloons');
  }
  function make(i){
    var b = el('button','bal');
    b.type = 'button';
    b.style.setProperty('--w', w + 'px');
    b.style.background = 'var(--' + HUES[i % HUES.length] + ')';
    b.style.left = 'calc(8px + ' + (((i + 0.5) / n).toFixed(3)) + ' * (100% - ' + (16 + w) + 'px))';
    if(ordered) b.textContent = String(i + 1);
    b.setAttribute('aria-label', ordered ? ('Balloon ' + (i + 1)) : 'Balloon');
    var o = {el:b, num:i+1, y:0, vy:(ordered ? 30 : 20) + Math.random()*12, ph:Math.random()*6.283, popped:false};
    b.onclick = function(){
      if(o.popped) return;
      if(ordered && o.num !== want){ api.nope(b); return; }
      o.popped = true;
      b.classList.add('gone');
      sfx.pop();
      if(ordered){ want++; if(want <= n) ask(); }
      var left = 0;
      for(var k=0;k<bals.length;k++) if(!bals[k].popped) left++;
      if(left === 0){
        cancelAnimationFrame(raf);
        if(!api.score()) setTimeout(round, 750);
      }
    };
    sky.appendChild(b);
    return o;
  }
  function frame(t){
    if(!sky.isConnected){ cancelAnimationFrame(raf); return; }
    var dt = Math.min(0.05, (t - (last || t)) / 1000);
    last = t;
    for(var i=0;i<bals.length;i++){
      var o = bals[i];
      if(o.popped) continue;
      o.y -= o.vy * dt;
      if(o.y < 6) o.y = 6;            /* balloons rest on the ceiling, they never escape */
      o.ph += dt * 1.4;
      o.el.style.transform = 'translate3d(' + (Math.sin(o.ph) * 11).toFixed(1) + 'px,' + o.y.toFixed(1) + 'px,0)';
    }
    raf = requestAnimationFrame(frame);
    api.raf(raf);
  }
  function round(){
    if(!api.play.isConnected) return;
    cancelAnimationFrame(raf);
    sky.innerHTML = '';
    bals = [];
    want = 1;
    ask();
    for(var i=0;i<n;i++) bals.push(make(i));
    requestAnimationFrame(function(){
      var H = sky.clientHeight || 320;
      var gap = (H * 1.15) / n;       /* most of them are already in the sky */
      for(var k=0;k<bals.length;k++) bals[k].y = H * 0.1 + k * gap;
      last = 0;
      raf = requestAnimationFrame(frame);
      api.raf(raf);
    });
  }
  round();
};

/* ---------- 2. memory match ---------- */
BUILD.memory = function(api){
  var pairs = state.age === 5 ? 6 : 3;
  var cols = state.age === 5 ? 4 : 3;
  var pool = ['🐸','🦊','🐼','🦉','🐙','🐝','🦋','🐞','🐳','🦄'];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    api.prompt('<span class="big">🐼</span><span class="ptext">find the pairs</span>', 'Find the pairs');
    var picks = shuffle(pool.slice()).slice(0, pairs);
    var cards = shuffle(picks.concat(picks));
    var grid = centred(el('div','grid'), cols, 118);
    api.play.innerHTML = '';
    api.play.appendChild(grid);
    var open = [], lock = false, found = 0;

    cards.forEach(function(sym){
      var b = chunk('sky','card3d down','?');
      b.setAttribute('aria-label','Card');
      var faceUp = false, matched = false;
      function cover(){
        faceUp = false;
        b.innerHTML = '?';
        b.classList.add('down');
        b.classList.remove('plain');
        b.style.setProperty('--c','var(--sky)');
        b.style.setProperty('--ce','var(--sky-e)');
      }
      function keep(){
        matched = true;
        b.classList.remove('plain');
        b.style.setProperty('--c','var(--grass)');
        b.style.setProperty('--ce','var(--grass-e)');
      }
      b.onclick = function(){
        if(lock || faceUp || matched) return;
        faceUp = true;
        b.classList.remove('down');
        b.classList.add('plain');
        b.style.setProperty('--c','var(--card)');
        b.style.setProperty('--ce','var(--card-edge)');
        b.innerHTML = sym;
        sfx.tap();
        open.push({sym:sym, cover:cover, keep:keep});
        if(open.length === 2){
          lock = true;
          var pairUp = open[0].sym === open[1].sym;
          setTimeout(function(){
            if(pairUp){
              open.forEach(function(o){ o.keep(); });
              found++;
              sfx.pop();
            } else {
              open.forEach(function(o){ o.cover(); });
            }
            open = [];
            lock = false;
            if(pairUp && found === pairs){ if(!api.score()) setTimeout(round, 850); }
          }, pairUp ? 350 : 950);
        }
      };
      grid.appendChild(b);
    });
  }
  round();
};

  /* Paint bucket: scanline flood fill with a little tolerance. */
function floodFill(g2, cv, sx, sy, css){
  var W = cv.width, H = cv.height;
  sx = Math.max(0, Math.min(W - 1, Math.round(sx)));
  sy = Math.max(0, Math.min(H - 1, Math.round(sy)));
  var img = g2.getImageData(0, 0, W, H), d = img.data;
  var si = (sy * W + sx) * 4;
  var sr = d[si], sg = d[si+1], sb = d[si+2];
  var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(css);
  if(!m) return;
  var fr = parseInt(m[1],16), fg = parseInt(m[2],16), fb = parseInt(m[3],16);
  if(Math.abs(sr-fr) + Math.abs(sg-fg) + Math.abs(sb-fb) < 12) return;
  function same(i){
    return Math.abs(d[i]-sr) + Math.abs(d[i+1]-sg) + Math.abs(d[i+2]-sb) < 90;
  }
  var stack = [[sx, sy]];
  while(stack.length){
    var pt = stack.pop(), x = pt[0], y = pt[1];
    var i = (y * W + x) * 4;
    while(x >= 0 && same((y * W + x) * 4)) x--;
    x++;
    var up = false, down = false;
    while(x < W && same((y * W + x) * 4)){
      i = (y * W + x) * 4;
      d[i] = fr; d[i+1] = fg; d[i+2] = fb; d[i+3] = 255;
      if(y > 0){
        var u = same(((y-1) * W + x) * 4);
        if(u && !up){ stack.push([x, y-1]); up = true; } else if(!u){ up = false; }
      }
      if(y < H - 1){
        var dn = same(((y+1) * W + x) * 4);

/* ---------- 7. doodle pad, Kid Pix style ------------------------------------
   Crayons; a rainbow brush; a sparkle brush; stamps that repeat along a drag so
   you can paint with hearts; a paint bucket; butterfly symmetry; procedural
   colouring pages to fill in; and an eraser that blows the picture up. Every
   picture here is drawn in code — there is not one image file in the app. */
BUILD.doodle = function(api){
  api.play.className = 'play fill';
  api.play.style.display = 'flex';
  api.play.style.flexDirection = 'column';
  api.play.style.gap = '8px';
  var cv = el('canvas','pad');
  var paints = el('div','tools');
  var kit = el('div','tools');
  api.play.innerHTML = '';
  api.play.appendChild(cv);
  api.play.appendChild(paints);
  api.play.appendChild(kit);

  var g2 = cv.getContext('2d', {willReadFrequently:true});
  var COLS = ['#1B2435','#F4634E','#FF9F52','#FFC031','#4CC483','#2E86B8','#A186E4','#FF93C6'];
  var STAMPS = ['⭐','❤️','🌈','🦄','🐙','🌸'];
  var SPARKS = ['✨','⭐','🌟','💫'];
  var colour = COLS[1], mode = 'crayon', stamp = null, mirror = false;
  var drawing = false, lx = 0, ly = 0, hue = 0, travelled = 0;

  function fit(){
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if(cv.width === w && cv.height === h) return;
    var old = null;
    if(cv.width > 1 && cv.height > 1){
      old = document.createElement('canvas');
      old.width = cv.width; old.height = cv.height;
      old.getContext('2d').drawImage(cv, 0, 0);
    }
    cv.width = w; cv.height = h;
    g2.fillStyle = '#fff';
    g2.fillRect(0, 0, w, h);
    if(old) g2.drawImage(old, 0, 0, w, h);
    g2.lineCap = 'round';
    g2.lineJoin = 'round';
  }
  requestAnimationFrame(fit);
  window.addEventListener('resize', function(){ if(cv.isConnected) fit(); });

  function at(e){
    var r = cv.getBoundingClientRect();
    return {x:(e.clientX - r.left) * (cv.width / r.width), y:(e.clientY - r.top) * (cv.height / r.height)};
  }

  /* Everything draws through these two, so butterfly mode is free. */
  function segment(x0, y0, x1, y1){
    g2.beginPath(); g2.moveTo(x0, y0); g2.lineTo(x1, y1); g2.stroke();
    if(mirror){
      g2.beginPath();
      g2.moveTo(cv.width - x0, y0);
      g2.lineTo(cv.width - x1, y1);
      g2.stroke();
    }
  }
  function drawEmoji(symbol, x, y, scale, spin){
    function once(px){
      g2.save();
      g2.translate(px, y);
      g2.rotate(spin == null ? Math.random() * 6.283 : spin);
      g2.font = Math.round(cv.width * scale) + 'px serif';
      g2.textAlign = 'center';
      g2.textBaseline = 'middle';
      g2.fillText(symbol, 0, 0);
      g2.restore();
    }
    once(x);
    if(mirror) once(cv.width - x);
  }

  function bucket(x, y, css){ floodFill(g2, cv, x, y, css); }

  /* Colouring pages, drawn with maths rather than shipped as pictures. */
  function outline(){
    g2.strokeStyle = '#1B2435';
    g2.lineWidth = Math.max(5, cv.width * 0.011);
    g2.lineJoin = 'round';
    g2.lineCap = 'round';
  }
  var pageAt = 0;
  function colouringPage(){
    g2.fillStyle = '#fff';
    g2.fillRect(0, 0, cv.width, cv.height);
    outline();
    ART[pageAt % ART.length](g2, cv.width, cv.height);
    pageAt++;
    sfx.pop();
  }

  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var pt = at(e);
    if(mode === 'fill'){ bucket(pt.x, pt.y, colour); sfx.pop(); return; }
    drawing = true; lx = pt.x; ly = pt.y; travelled = 1e9;   /* stamp at once */
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(mode === 'stamp' && stamp){ dab(pt.x, pt.y); return; }
    if(mode === 'sparkle'){ drawEmoji(pick(SPARKS), pt.x, pt.y, 0.055); return; }
    g2.lineWidth = Math.max(8, cv.width * (mode === 'rainbow' ? 0.03 : 0.022));
    g2.strokeStyle = mode === 'rainbow' ? 'hsl(' + hue + ',85%,55%)' : colour;
    segment(pt.x, pt.y, pt.x + 0.1, pt.y);
  });

  function dab(x, y){
    drawEmoji(stamp, x, y, 0.09 + Math.random() * 0.03);
    travelled = 0;
    sfx.tap();
  }

  cv.addEventListener('pointermove', function(e){
    if(!drawing) return;
    e.preventDefault();
    var pt = at(e);
    travelled += Math.abs(pt.x - lx) + Math.abs(pt.y - ly);

    if(mode === 'stamp' && stamp){
      if(travelled > cv.width * 0.085) dab(pt.x, pt.y);   /* paint WITH the icon */
      lx = pt.x; ly = pt.y;
      return;
    }
    if(mode === 'sparkle'){
      if(travelled > cv.width * 0.06){
        travelled = 0;
        drawEmoji(pick(SPARKS), pt.x + (Math.random() * 30 - 15), pt.y + (Math.random() * 30 - 15), 0.055);
      }
      lx = pt.x; ly = pt.y;
      return;
    }
    if(mode === 'rainbow'){
      hue = (hue + 7) % 360;
      g2.strokeStyle = 'hsl(' + hue + ',85%,55%)';
    }
    segment(lx, ly, pt.x, pt.y);
    lx = pt.x; ly = pt.y;
  });
  function stop(){ drawing = false; }
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);

  function boom(){
    var notes = [740, 560, 410, 300, 200];
    for(var i=0;i<notes.length;i++){
      (function(f, n){ setTimeout(function(){ tone(f, 0.17, 'sawtooth', 0.09); }, n * 70); })(notes[i], i);
    }
    cv.classList.add('boom');
    var started = Date.now();
    (function burst(){
      var done = (Date.now() - started) / 430;
      if(done >= 1 || !cv.isConnected){
        g2.fillStyle = '#fff';
        g2.fillRect(0, 0, cv.width, cv.height);
        cv.classList.remove('boom');
        return;
      }
      for(var k=0;k<3;k++){
        g2.fillStyle = 'rgba(255,255,255,0.55)';
        g2.beginPath();
        g2.arc(Math.random() * cv.width, Math.random() * cv.height, done * cv.width * 0.3, 0, 6.3);
        g2.fill();
      }
      requestAnimationFrame(burst);
    })();
  }

  function unpress(){
    var all = api.play.querySelectorAll('[aria-pressed]:not([data-keep])');
    for(var i=0;i<all.length;i++) all[i].setAttribute('aria-pressed','false');
  }

  COLS.forEach(function(c){
    var sw = el('button','swatch');
    sw.type = 'button';
    sw.style.background = c;
    sw.setAttribute('aria-label','Crayon');
    sw.setAttribute('aria-pressed', c === colour ? 'true' : 'false');
    sw.onclick = function(){
      colour = c;
      if(mode !== 'fill'){ mode = 'crayon'; stamp = null; }
      unpress();
      sw.setAttribute('aria-pressed','true');
      sfx.tap();
    };
    paints.appendChild(sw);
  });

  [{m:'rainbow', icon:'🌈', label:'Rainbow brush'},
   {m:'sparkle', icon:'✨', label:'Sparkle brush'},
   {m:'fill',    icon:'🪣', label:'Fill with colour'}].forEach(function(t){
    var b = chunk(null,'stamp', t.icon);
    b.setAttribute('aria-label', t.label);
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){
      mode = t.m; stamp = null;
      unpress(); b.setAttribute('aria-pressed','true');
      sfx.tap();
    };
    kit.appendChild(b);
  });

  STAMPS.forEach(function(symbol){
    var b = chunk(null,'stamp', symbol);
    b.setAttribute('aria-label','Stamp — press and drag to paint with it');
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){
      mode = 'stamp'; stamp = symbol;
      unpress(); b.setAttribute('aria-pressed','true');
      sfx.tap();
    };
    kit.appendChild(b);
  });

  var sym = chunk(null,'stamp','🦋');
  sym.setAttribute('aria-label','Butterfly — everything you draw is mirrored');
  sym.setAttribute('aria-pressed','false');
  sym.setAttribute('data-keep','1');
  sym.onclick = function(){
    mirror = !mirror;
    sym.setAttribute('aria-pressed', mirror ? 'true' : 'false');
    sfx.tap();
  };
  kit.appendChild(sym);

  var page = chunk('sky','stamp','🎨');
  page.setAttribute('aria-label','A new picture to colour in');
  page.onclick = colouringPage;
  kit.appendChild(page);

  var hang = chunk('grass','stamp','🖼️');
  hang.setAttribute('aria-label','Frame it and hang it on the wall');
  hang.onclick = function(){
    if(!hangUp(cv)) return;
    sfx.win();
    say('On the wall!');
    cv.classList.add('hung');
    setTimeout(function(){
      cv.classList.remove('hung');
      g2.fillStyle = '#fff';
      g2.fillRect(0, 0, cv.width, cv.height);
    }, 620);
  };
  kit.appendChild(hang);

  var blow = chunk('tomato','stamp','💥');
  blow.setAttribute('aria-label','Blow up the picture');
  blow.onclick = boom;
  kit.appendChild(blow);
};

/* ---------- Coloring Book: pick a picture, tap inside the lines ------------
   The pictures are drawn by the app, not copied from anywhere. */
BUILD.colour = function(api){
  api.play.className = 'play fill';
  api.play.style.display = 'flex';
  api.play.style.flexDirection = 'column';
  api.play.style.gap = '8px';
  var cv = el('canvas','pad');
  var paints = el('div','tools');
  var kit = el('div','tools');
  api.play.innerHTML = '';
  api.play.appendChild(cv);
  api.play.appendChild(paints);
  api.play.appendChild(kit);

  var g2 = cv.getContext('2d', {willReadFrequently:true});
  var COLS = ['#F4634E','#FF9F52','#FFC031','#4CC483','#2E86B8',
              '#A186E4','#FF93C6','#8A5A3B','#1B2435','#FFFFFF'];
  var STICKERS = ['⭐','❤️','🌸','🦋','🌈','🦄','✨','🐝'];
  var colour = COLS[0], mode = 'fill', sticker = null;
  var drawing = false, lx = 0, ly = 0, travelled = 0;
  var page = rnd(ART.length);

  function dab(x, y){
    g2.save();
    g2.translate(x, y);
    g2.rotate(Math.random() * 6.283);
    g2.font = Math.round(cv.width * (0.085 + Math.random() * 0.03)) + 'px serif';
    g2.textAlign = 'center';
    g2.textBaseline = 'middle';
    g2.fillText(sticker, 0, 0);
    g2.restore();
    travelled = 0;
    sfx.tap();
  }

  function redraw(){
    g2.fillStyle = '#fff';
    g2.fillRect(0, 0, cv.width, cv.height);
    g2.strokeStyle = '#1B2435';
    g2.lineWidth = Math.max(5, cv.width * 0.011);
    g2.lineJoin = 'round';
    g2.lineCap = 'round';
    ART[page % ART.length](g2, cv.width, cv.height);
  }

  function fit(){
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if(cv.width === w && cv.height === h) return false;
    cv.width = w; cv.height = h;
    return true;
  }
  requestAnimationFrame(function(){ fit(); redraw(); });
  window.addEventListener('resize', function(){
    if(cv.isConnected && fit()) redraw();
  });

  function at(e){
    var r = cv.getBoundingClientRect();
    return {x:(e.clientX - r.left) * (cv.width / r.width), y:(e.clientY - r.top) * (cv.height / r.height)};
  }

  cv.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var pt = at(e);
    if(mode === 'fill'){
      floodFill(g2, cv, pt.x, pt.y, colour);
      sfx.pop();
      return;
    }
    drawing = true; lx = pt.x; ly = pt.y; travelled = 0;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(mode === 'sticker' && sticker){ dab(pt.x, pt.y); return; }
    g2.lineCap = 'round';
    g2.lineJoin = 'round';
    g2.strokeStyle = colour;
    g2.lineWidth = Math.max(6, cv.width * (mode === 'brush' ? 0.042 : 0.013));
    g2.beginPath(); g2.moveTo(pt.x, pt.y); g2.lineTo(pt.x + 0.1, pt.y); g2.stroke();
  });
  cv.addEventListener('pointermove', function(e){
    if(!drawing) return;
    e.preventDefault();
    var pt = at(e);
    if(mode === 'sticker' && sticker){
      travelled += Math.abs(pt.x - lx) + Math.abs(pt.y - ly);
      if(travelled > cv.width * 0.1) dab(pt.x, pt.y);
      lx = pt.x; ly = pt.y;
      return;
    }
    g2.beginPath(); g2.moveTo(lx, ly); g2.lineTo(pt.x, pt.y); g2.stroke();
    lx = pt.x; ly = pt.y;
  });
  function stop(){ drawing = false; }
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);

  function unpress(){
    var all = kit.querySelectorAll('[aria-pressed]');
    for(var i=0;i<all.length;i++) all[i].setAttribute('aria-pressed','false');
  }

  COLS.forEach(function(c){
    var sw = el('button','swatch');
    sw.type = 'button';
    sw.style.background = c;
    if(c === '#FFFFFF') sw.style.boxShadow = '0 4px 0 rgba(27,36,53,.28), inset 0 0 0 2px #C2DDEB';
    sw.setAttribute('aria-label','Colour');
    sw.setAttribute('aria-pressed', c === colour ? 'true' : 'false');
    sw.onclick = function(){
      colour = c;
      var all = paints.querySelectorAll('[aria-pressed]');
      for(var i=0;i<all.length;i++) all[i].setAttribute('aria-pressed','false');
      sw.setAttribute('aria-pressed','true');
      sfx.tap();
    };
    paints.appendChild(sw);
  });

  [{m:'fill',  icon:'🪣', label:'Fill a shape'},
   {m:'brush', icon:'🖌️', label:'Paint with a fat brush'},
   {m:'pen',   icon:'✏️', label:'Draw a thin line'}].forEach(function(t){
    var b = chunk(null,'stamp', t.icon);
    b.setAttribute('aria-label', t.label);
    b.setAttribute('aria-pressed', t.m === mode ? 'true' : 'false');
    b.onclick = function(){ mode = t.m; unpress(); b.setAttribute('aria-pressed','true'); sfx.tap(); };
    kit.appendChild(b);
  });

  STICKERS.forEach(function(symbol){
    var b = chunk(null,'stamp', symbol);
    b.setAttribute('aria-label','Sticker — press and drag to scatter it');
    b.setAttribute('aria-pressed','false');
    b.onclick = function(){
      mode = 'sticker'; sticker = symbol;
      unpress(); b.setAttribute('aria-pressed','true');
      sfx.tap();
    };
    kit.appendChild(b);
  });

  var hang = chunk('grass','stamp','🖼️');
  hang.setAttribute('aria-label','Frame it and hang it on the wall');
  hang.onclick = function(){
    if(!hangUp(cv)) return;
    sfx.win();
    say('On the wall!');
    cv.classList.add('hung');
    setTimeout(function(){
      cv.classList.remove('hung');
      page++;
      redraw();
    }, 620);
  };
  kit.appendChild(hang);

  var next = chunk('sky','stamp','➡️');
  next.setAttribute('aria-label','Another picture');
  next.onclick = function(){ page++; redraw(); sfx.pop(); };
  kit.appendChild(next);

  var again = chunk('tomato','stamp','🔄');
  again.setAttribute('aria-label','Start this picture again');
  again.onclick = function(){ redraw(); sfx.tap(); };
  kit.appendChild(again);
};

/* ---------- 8. how many? count the things, tap the numeral ---------- */
BUILD.howmany = function(api){
  var THINGS = ['🐟','🍓','🐥','🦋','🚗','⭐','🍎','🐸','🌸','🐞','🍪','🐠'];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    var big = state.age === 5;
    var n = big ? (3 + rnd(8)) : (1 + rnd(3));
    var thing = pick(THINGS);
    var html = '';
    for(var i=0;i<n;i++) html += '<span class="count-item">' + thing + '</span>';
    api.prompt(html, 'How many?');
    var opts = [n];
    if(big){
      var near = [n-2, n-1, n+1, n+2].filter(function(v){ return v >= 1 && v <= 10; });
      shuffle(near);
      while(opts.length < 3 && near.length){
        var c = near.pop();
        if(opts.indexOf(c) < 0) opts.push(c);
      }
    } else opts = [1,2,3];
    shuffle(opts);
    var row = centred(el('div','grid'), 3, 120);
    api.play.innerHTML = '';
    api.play.appendChild(row);
    var finished = false;
    opts.forEach(function(v){
      var b = chunk('grass','opt numeric', String(v));
      b.setAttribute('aria-label', String(v));
      b.onclick = function(){
        if(finished) return;
        if(v === n){
          finished = true;
          sfx.pop();
          say(String(n));
          if(!api.score()) setTimeout(round, 1000);
        } else api.nope(b);
      };
      row.appendChild(b);
    });
  }
  round();
};

/* ---------- 9. which is more: comparing amounts ---------- */
BUILD.more = function(api){
  var THINGS = ['🍓','🐟','⭐','🍪','🐥','🌸','🍎','🐞'];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    api.prompt('<span class="big">⚖️</span><span class="ptext">tap the side with more</span>', 'Tap the side with more');
    var thing = pick(THINGS);
    var a, b;
    if(state.age === 5){
      a = 2 + rnd(7);
      b = a + (Math.random() < 0.5 ? -1 : 1) * (1 + rnd(2));
      if(b < 1) b = a + 2;
      if(b === a) b = a + 1;
    } else {
      a = 1 + rnd(2);
      b = 4 + rnd(3);
      if(Math.random() < 0.5){ var t = a; a = b; b = t; }
    }
    var most = Math.max(a, b), least = Math.min(a, b);
    var grid = centred(el('div','grid'), 2, 190);
    api.play.innerHTML = '';
    api.play.appendChild(grid);
    var finished = false;
    [a, b].forEach(function(count){
      var fill = '';
      for(var i=0;i<count;i++) fill += thing;
      var pn = chunk(null,'panel', fill);
      pn.setAttribute('aria-label', count + ' of them');
      pn.onclick = function(){
        if(finished) return;
        if(count === most){
          finished = true;
          sfx.pop();
          api.promptHTML('<span class="num">' + most + '</span><span class="ptext">is more than</span><span class="num">' + least + '</span>');
          say(most + ' is more than ' + least);
          if(!api.score()) setTimeout(round, 1300);
        } else api.nope(pn);
      };
      grid.appendChild(pn);
    });
  }
  round();
};

/* ---------- 10. starts with: hearing words at 3, first letters at 5 ---------- */

/* ---------- 11. doesn't belong: sorting by category ---------- */

/* ---------- A is for… teaching letters to someone who barely has them ----------
   Each round models the letter first ("This is A. A is for apple."), gives one
   giant A to tap, and only then asks her to pick it out of three. She hears the
   sound while only ever being asked to match a shape, so she cannot fail. */
BUILD.letters = function(api){
  var LW = [
    {e:'🍎', w:'apple', l:'A'},   {e:'⚽', w:'ball', l:'B'},
    {e:'🐱', w:'cat', l:'C'},     {e:'🐶', w:'dog', l:'D'},
    {e:'🐘', w:'elephant', l:'E'},{e:'🐟', w:'fish', l:'F'},
    {e:'🍇', w:'grapes', l:'G'},  {e:'🎩', w:'hat', l:'H'},
    {e:'🔑', w:'key', l:'K'},     {e:'🦁', w:'lion', l:'L'},
    {e:'🌙', w:'moon', l:'M'},    {e:'👃', w:'nose', l:'N'},
    {e:'🐷', w:'pig', l:'P'},     {e:'🚀', w:'rocket', l:'R'},
    {e:'☀️', w:'sun', l:'S'},   {e:'🌳', w:'tree', l:'T'},
    {e:'🐳', w:'whale', l:'W'},   {e:'🦓', w:'zebra', l:'Z'}
  ];
  var target = null;

  function card(tail){
    return '<span class="num">' + target.l + '</span>' +
           '<span class="big">' + target.e + '</span>' +
           '<span class="ptext">' + tail + '</span>';
  }

  function teach(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    api.prompt(card(target.l + ' is for ' + target.w),
      'This is ' + target.l + '. ' + target.l + ' is for ' + target.w + '. Tap the ' + target.l + '.');
    var one = centred(el('div','grid'), 1, 190);
    var b = chunk('grape','opt numeric', target.l);
    b.setAttribute('aria-label', target.l);
    var used = false;
    b.onclick = function(){
      if(used) return;
      used = true;
      sfx.pop();
      say(target.l + ' is for ' + target.w);
      setTimeout(find, 1100);
    };
    one.appendChild(b);
    api.play.innerHTML = '';
    api.play.appendChild(one);
  }

  function find(){
    if(!api.play.isConnected) return;
    api.prompt(card('now find the ' + target.l), 'Now find the ' + target.l);
    var others = shuffle(LW.filter(function(x){ return x.l !== target.l; })).slice(0, 2);
    var items = shuffle([{l:target.l, ok:true}, {l:others[0].l, ok:false}, {l:others[1].l, ok:false}]);
    var grid = centred(el('div','grid'), 3, 120);
    api.play.innerHTML = '';
    api.play.appendChild(grid);
    var finished = false, wrong = 0, right = null;
    items.forEach(function(it){
      var b = chunk(null,'opt numeric', it.l);
      b.setAttribute('aria-label', it.l);
      if(it.ok) right = b;
      b.onclick = function(){
        if(finished) return;
        if(it.ok){
          finished = true;
          b.classList.add('gone');
          sfx.pop();
          say(target.l + '!');
          if(!api.score()) setTimeout(round, 1200);
        } else {
          wrong++;
          api.nope(b);
          if(right) right.classList.add('bob');   /* one wrong tap is enough to help */
        }
      };
      grid.appendChild(b);
    });
  }

  function round(){
    if(!api.play.isConnected) return;
    target = pick(LW);
    teach();
  }
  round();
};

/* ---------- Mancala ----------------------------------------------------------
   Real rules (sow counterclockwise, free turn on landing in your own store,
   capture the pit opposite an empty one you land in), but three beans a pit so
   a game lasts a few minutes, and nobody is told they lost. The bean count sits
   on every pit, so it doubles as counting practice. */
BUILD.mancala = function(api){
  var PITS = 6, SEED = 3, MINE = 6, THEIRS = 13;
  var board = [], busy = false, over = false, justDropped = -1;
  var tally = 0, tallyAt = -1;   /* 1, 2, 3… as the rocks are counted out */

  /* Rocks, not numerals \u2014 you watch them land one at a time. */
  function rocks(n, index){
    if(n === 0) return '';
    var out = '';
    for(var i=0;i<n;i++){
      var fresh = (index === justDropped && i === n - 1) ? ' drop' : '';
      out += '<span class="rock' + fresh + '"></span>';
    }
    return '<span class="rocks' + (n > 6 ? ' many' : '') + '">' + out + '</span>';
  }

  function mySideEmpty(){
    for(var i=0;i<PITS;i++) if(board[i] > 0) return false;
    return true;
  }
  function theirSideEmpty(){
    for(var i=7;i<13;i++) if(board[i] > 0) return false;
    return true;
  }

  function pitView(index, mine){
    var n = board[index];
    var live = mine && n > 0 && !busy && !over;
    var extras = '<span class="count">' + n + '</span>' +
                 (index === tallyAt ? '<span class="tally">' + tally + '</span>' : '');
    var b;
    if(mine){
      b = chunk(null, 'pit' + (live ? ' live' : ''), rocks(n, index) + extras);
      if(live) b.onclick = function(){ play(index); };
    } else {
      b = el('div','pit still', rocks(n, index) + extras);
    }
    b.setAttribute('aria-label', n + (n === 1 ? ' bean' : ' beans'));
    return b;
  }

  function draw(){
    api.play.className = 'play fill';
    api.play.innerHTML = '';
    var wrap = el('div','mancala');
    wrap.appendChild(el('div','store',
      '<span class="sicon">🧌</span>' + rocks(board[THEIRS], THEIRS) +
      '<span class="snum">' + board[THEIRS] + '</span>' +
      (THEIRS === tallyAt ? '<span class="tally">' + tally + '</span>' : '')));
    var rows = el('div','rows');
    var top = el('div','mrow');
    for(var i=PITS-1;i>=0;i--) top.appendChild(pitView(i+7, false));
    var bottom = el('div','mrow');
    for(var j=0;j<PITS;j++) bottom.appendChild(pitView(j, true));
    rows.appendChild(top);
    rows.appendChild(bottom);
    wrap.appendChild(rows);
    wrap.appendChild(el('div','store',
      '<span class="sicon">' + kid().icon + '</span>' + rocks(board[MINE], MINE) +
      '<span class="snum">' + board[MINE] + '</span>' +
      (MINE === tallyAt ? '<span class="tally">' + tally + '</span>' : '')));
    api.play.appendChild(wrap);
  }

  function sow(start, mine, done){
    var hand = board[start];
    board[start] = 0;
    justDropped = -1;
    tally = 0;
    tallyAt = -1;
    var at = start;
    draw();
    function step(){
      if(!api.play.isConnected) return;
      if(hand === 0){ done(at); return; }
      at = (at + 1) % 14;
      if(mine && at === THEIRS) at = (at + 1) % 14;
      if(!mine && at === MINE) at = (at + 1) % 14;
      board[at]++;
      justDropped = at;
      tally++;
      tallyAt = at;
      say(String(tally));          /* counting practice, by accident */
      hand--;
      sfx.tap();
      draw();
      setTimeout(step, 420);     /* slow enough to watch each rock land */
    }
    setTimeout(step, 300);
  }

  function after(last, mine){
    var store = mine ? MINE : THEIRS;
    var low = mine ? 0 : 7, high = mine ? 5 : 12;
    if(last >= low && last <= high && board[last] === 1){
      var facing = 12 - last;                 /* the pit across the board */
      if(board[facing] > 0){
        board[store] += board[facing] + 1;
        board[facing] = 0;
        board[last] = 0;
        sfx.pop();
      }
    }
    draw();
    if(mySideEmpty() || theirSideEmpty()){ sweep(); return; }
    if(last === store){                        /* landed in your own store: go again */
      if(mine){ busy = false; draw(); say('Go again!'); }
      else setTimeout(monster, 700);
      return;
    }
    if(mine) setTimeout(monster, 700);
    else { busy = false; draw(); }
  }

  function monster(){
    if(over || !api.play.isConnected) return;
    var moves = [];
    for(var i=7;i<13;i++) if(board[i] > 0) moves.push(i);
    if(!moves.length){ sweep(); return; }
    var free = null;
    for(var k=0;k<moves.length;k++) if(moves[k] + board[moves[k]] === THEIRS) free = moves[k];
    busy = true;
    draw();
    sow(free !== null ? free : pick(moves), false, function(last){ after(last, false); });
  }

  function play(index){
    if(busy || over || board[index] === 0) return;
    busy = true;
    draw();
    sow(index, true, function(last){ after(last, true); });
  }

  function sweep(){
    for(var i=0;i<PITS;i++){ board[MINE] += board[i]; board[i] = 0; }
    for(var j=7;j<13;j++){ board[THEIRS] += board[j]; board[j] = 0; }
    over = true;
    busy = true;
    draw();
    var mine = board[MINE], theirs = board[THEIRS];
    var line = mine > theirs ? (kid().name + ' wins!')
             : (mine === theirs ? "It's a tie!" : 'So close!');
    api.promptHTML('<span class="num">' + mine + '</span><span class="ptext">' + line + '</span>' +
                   '<span class="num">' + theirs + '</span>');
    say(line);
    setTimeout(function(){ api.score(); }, 1100);
  }

  board = [];
  for(var i=0;i<14;i++) board.push(0);
  for(var j=0;j<PITS;j++){ board[j] = SEED; board[j+7] = SEED; }
  api.prompt('<span class="big">🫘</span><span class="ptext">tap your beans to move them</span>',
             'Tap your beans to move them');
  draw();
};

/* ---------- Copy the Tune: four pads, a growing sequence --------------------
   Getting it wrong never ends anything — the tune simply plays again. */
BUILD.tune = function(api){
  var PADS = [{hue:'tomato', f:523}, {hue:'sun', f:659}, {hue:'sky', f:784}, {hue:'grass', f:1047}];
  var seq = [], step = 0, busy = true, buttons = [];

  function build(){
    api.play.className = 'play';
    var grid = centred(el('div','grid'), 2, 150);
    api.play.innerHTML = '';
    buttons = [];
    PADS.forEach(function(pad, i){
      var b = chunk(pad.hue, 'opt pad2', '');
      b.setAttribute('aria-label', 'Pad ' + (i + 1));
      b.onclick = function(){ tapped(i); };
      buttons.push(b);
      grid.appendChild(b);
    });
    api.play.appendChild(grid);
  }

  function flash(i, then){
    var b = buttons[i];
    if(!b) return;
    b.classList.add('lit');
    tone(PADS[i].f, 0.3, 'triangle', 0.13);
    setTimeout(function(){
      b.classList.remove('lit');
      if(then) then();
    }, 340);
  }

  function playSeq(){
    if(!api.play.isConnected) return;
    busy = true;
    step = 0;
    api.prompt('<span class="big">🎵</span><span class="ptext">listen</span>', 'Listen');
    var i = 0;
    (function next(){
      if(!api.play.isConnected) return;
      if(i >= seq.length){
        busy = false;
        api.prompt('<span class="big">👆</span><span class="ptext">now your turn</span>', 'Now your turn');
        return;
      }
      flash(seq[i], function(){ i++; setTimeout(next, 170); });
    })();
  }

  function tapped(i){
    if(busy) return;
    flash(i);
    if(seq[step] === i){
      step++;
      if(step >= seq.length){
        busy = true;
        setTimeout(function(){
          if(!api.score()){
            seq.push(rnd(4));
            setTimeout(playSeq, 800);
          }
        }, 450);
      }
    } else {
      busy = true;
      api.nope(buttons[i]);
      setTimeout(playSeq, 950);   /* just hear it again */
    }
  }

  build();
  var start = state.age === 5 ? 2 : 1;
  for(var k=0;k<start;k++) seq.push(rnd(4));
  setTimeout(playSeq, 800);
};

/* ---------- Dot to Dot: tap the numbers in order, a shape appears ---------- */
BUILD.dots = function(api){
  function ring(count, outer, inner){
    var pts = [];
    for(var i=0;i<count;i++){
      var a = (-90 + i * (360 / count)) * Math.PI / 180;
      var r = (i % 2 === 0 || inner == null) ? outer : inner;
      pts.push([0.5 + r * Math.cos(a), 0.5 + r * Math.sin(a)]);
    }
    return pts;
  }
  function pentagram(){
    var outer = ring(5, 0.40, null);
    return [outer[0], outer[2], outer[4], outer[1], outer[3]];
  }
  var SMALL = [
    {emoji:'🌟', pts: pentagram()},
    {emoji:'🏠', pts: [[0.22,0.85],[0.22,0.48],[0.5,0.17],[0.78,0.48],[0.78,0.85]]}
  ];
  var BIG = [
    {emoji:'⭐', pts: ring(10, 0.40, 0.17)},
    {emoji:'🌸', pts: ring(10, 0.40, 0.23)}
  ];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play fill';
    var shape = pick(state.age === 5 ? BIG : SMALL);
    var pts = shape.pts;
    api.prompt('<span class="big">✏️</span><span class="ptext">tap 1, then 2, then 3…</span>',
               'Tap the numbers in order, starting at one');

    var wrap = el('div','dotwrap');
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('class','dotsvg');
    var line = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    line.setAttribute('class','dotline');
    svg.appendChild(line);
    wrap.appendChild(svg);

    var next = 0, drawn = [], buttons = [];
    pts.forEach(function(pt, i){
      var b = chunk(i === 0 ? 'sun' : null, 'dotbtn', String(i + 1));
      b.style.left = (pt[0] * 100) + '%';
      b.style.top = (pt[1] * 100) + '%';
      b.setAttribute('aria-label', String(i + 1));
      b.onclick = function(){
        if(i !== next) { api.nope(b); return; }
        b.classList.add('done');
        b.style.removeProperty('--c');
        b.style.removeProperty('--ce');
        drawn.push((pt[0] * 100).toFixed(1) + ',' + (pt[1] * 100).toFixed(1));
        line.setAttribute('points', drawn.join(' '));
        sfx.pop();
        say(String(i + 1));
        next++;
        if(next < pts.length){
          buttons[next].style.setProperty('--c','var(--sun)');
          buttons[next].style.setProperty('--ce','var(--sun-e)');
          return;
        }
        drawn.push((pts[0][0] * 100).toFixed(1) + ',' + (pts[0][1] * 100).toFixed(1));
        line.setAttribute('points', drawn.join(' '));
        line.classList.add('shut');
        var prize = el('div','prize', shape.emoji);
        wrap.appendChild(prize);
        if(!api.score()) setTimeout(round, 1500);
      };
      buttons.push(b);
      wrap.appendChild(b);
    });

    api.play.innerHTML = '';
    api.play.appendChild(wrap);
  }
  round();
};

/* ---------- Big to Small: putting sizes in order ---------- */
BUILD.sizes = function(api){
  var SCALES = [1, 0.74, 0.54, 0.39];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    var count = state.age === 5 ? 4 : 3;
    var thing = pick(Content_countable());
    var items = [];
    for(var i=0;i<count;i++) items.push({rank:i, scale:SCALES[i]});
    shuffle(items);
    api.prompt('<span class="big">📏</span><span class="ptext">tap the biggest one first</span>',
               'Tap the biggest one first');
    var row = el('div','sizerow');
    api.play.innerHTML = '';
    api.play.appendChild(row);
    var next = 0, left = count;
    items.forEach(function(it){
      var b = chunk(null,'sizebtn', '<span style="font-size:' + Math.round(it.scale * 64) + 'px">' + thing + '</span>');
      b.setAttribute('aria-label','Picture');
      b.onclick = function(){
        if(b.classList.contains('gone')) return;
        if(it.rank !== next){ api.nope(b); return; }
        b.classList.add('gone');
        sfx.pop();
        next++;
        left--;
        if(left === 0 && !api.score()) setTimeout(round, 900);
      };
      row.appendChild(b);
    });
  }
  round();
};
function Content_countable(){
  return ['🐟','🍓','🐥','🦋','🚗','⭐','🍎','🐸','🌸','🐞','🍪','🐠'];
}

/* ---------- Rhyme Time: hearing that two words end the same --------------- */
BUILD.rhyme = function(api){
  var PAIRS = [
    ['🐱','cat','🎩','hat'], ['🐶','dog','🐸','frog'],
    ['⭐','star','🚗','car'],   ['🐝','bee','🌳','tree'],
    ['🌙','moon','🥄','spoon'], ['🐭','mouse','🏠','house'],
    ['🐟','fish','🍽️','dish'], ['🐍','snake','🍰','cake'],
    ['🐳','whale','🐌','snail'], ['🐐','goat','⛵','boat'],
    ['🐻','bear','🍐','pear'], ['🌹','rose','👃','nose']
  ];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    var sets = shuffle(PAIRS.slice());
    var cue = sets[0];
    var options = shuffle([
      {e:cue[2], w:cue[3], ok:true},
      {e:sets[1][0], w:sets[1][1], ok:false},
      {e:sets[2][0], w:sets[2][1], ok:false}
    ]);
    var names = options.map(function(o){ return o.w; });
    api.prompt('<span class="big">' + cue[0] + '</span><span class="ptext">which one rhymes with ' + cue[1] + '?</span>',
      'Which one rhymes with ' + cue[1] + '? Is it ' + names[0] + ', ' + names[1] + ', or ' + names[2] + '?');
    var grid = centred(el('div','grid'), 3, 130);
    api.play.innerHTML = '';
    api.play.appendChild(grid);
    var finished = false, right = null;
    options.forEach(function(o){
      var b = chunk(null,'opt', o.e);
      b.setAttribute('aria-label', o.w);
      if(o.ok) right = b;
      b.onclick = function(){
        if(finished) return;
        if(o.ok){
          finished = true;
          b.classList.add('gone');
          sfx.pop();
          say(cue[1] + ', ' + o.w + '. They rhyme!');
          if(!api.score()) setTimeout(round, 1700);
        } else {
          api.nope(b);
          say('That is a ' + o.w);
          if(right) right.classList.add('bob');
        }
      };
      grid.appendChild(b);
    });
  }
  round();
};

/* ---------- What Changed?: a quick look, a blink, one thing different ------ */
BUILD.changed = function(api){
  var POOL = ['🐶','🐱','🐼','🦊','🐸','🐥','🐝','🦁',
              '🍎','🍌','🍪','🍕','🚗','🚌','⛵','🎩'];

  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play';
    var count = state.age === 5 ? 5 : 3;
    var picks = shuffle(POOL.slice());
    var items = picks.slice(0, count);
    var spare = picks[count];
    var swapAt = rnd(count);

    api.prompt('<span class="big">👀</span><span class="ptext">look carefully…</span>', 'Look carefully');
    var row = centred(el('div','grid'), count, 110);
    api.play.innerHTML = '';
    api.play.appendChild(row);
    var tiles = items.map(function(sym){
      var b = chunk(null,'opt', sym);
      b.setAttribute('aria-label','Picture');
      row.appendChild(b);
      return b;
    });

    setTimeout(function(){
      if(!api.play.isConnected) return;
      tiles.forEach(function(b){ b.innerHTML = '?'; b.classList.add('hidden-card'); });
      sfx.tap();
      setTimeout(function(){
        if(!api.play.isConnected) return;
        items[swapAt] = spare;
        tiles.forEach(function(b, i){
          b.innerHTML = items[i];
          b.classList.remove('hidden-card');
        });
        api.prompt('<span class="big">🤔</span><span class="ptext">which one changed?</span>', 'Which one changed?');
        var finished = false;
        tiles.forEach(function(b, i){
          b.onclick = function(){
            if(finished) return;
            if(i === swapAt){
              finished = true;
              b.classList.add('gone');
              sfx.pop();
              if(!api.score()) setTimeout(round, 900);
            } else {
              api.nope(b);
              tiles[swapAt].classList.add('bob');
            }
          };
        });
      }, 700);
    }, state.age === 5 ? 2300 : 3200);
  }
  round();
};

/* ---------- Find the Way: drag along the stepping stones ------------------- */
BUILD.maze = function(api){
  function round(){
    if(!api.play.isConnected) return;
    api.play.className = 'play fill';
    var count = state.age === 5 ? 9 : 5;
    var waves = state.age === 5 ? 1.6 : 1.0;
    var phase = Math.random() * 6.283;
    var pts = [];
    for(var i=0;i<count;i++){
      var t = i / (count - 1);
      var y = 0.5 + 0.30 * Math.sin(t * Math.PI * 2 * waves + phase);
      pts.push([0.10 + t * 0.80, Math.max(0.16, Math.min(0.84, y))]);
    }
    api.prompt('<span class="big">🌟</span><span class="ptext">drag from the star to the house</span>',
               'Drag your finger from the star to the house');

    var wrap = el('div','mazewrap');
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('class','mazesvg');
    var line = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    line.setAttribute('class','mazeline');
    svg.appendChild(line);
    wrap.appendChild(svg);

    var next = 0, trail = [], stones = [], finished = false;

    function reach(i){
      if(finished || i !== next) return;
      stones[i].classList.add('lit');
      trail.push((pts[i][0] * 100).toFixed(1) + ',' + (pts[i][1] * 100).toFixed(1));
      line.setAttribute('points', trail.join(' '));
      sfx.tap();
      next++;
      if(next >= count){
        finished = true;
        sfx.pop();
        say('You found the way!');
        if(!api.score()) setTimeout(round, 1200);
      }
    }

    pts.forEach(function(pt, i){
      var face = i === 0 ? '🌟' : (i === count - 1 ? '🏠' : '');
      var b = chunk(i === 0 ? 'sun' : null, 'stone', face);
      b.style.left = (pt[0] * 100) + '%';
      b.style.top = (pt[1] * 100) + '%';
      b.setAttribute('aria-label', i === 0 ? 'Start' : (i === count - 1 ? 'House' : 'Stone ' + (i + 1)));
      b.onclick = function(){ reach(i); };
      stones.push(b);
      wrap.appendChild(b);
    });

    var down = false;
    function track(e){
      if(!down || finished) return;
      var target = pts[next];
      if(!target) return;
      var r = wrap.getBoundingClientRect();
      var dx = (e.clientX - r.left) - target[0] * r.width;
      var dy = (e.clientY - r.top) - target[1] * r.height;
      if(Math.sqrt(dx * dx + dy * dy) < 48) reach(next);
    }
    wrap.addEventListener('pointerdown', function(e){ down = true; track(e); });
    wrap.addEventListener('pointermove', track);
    wrap.addEventListener('pointerup', function(){ down = false; });
    wrap.addEventListener('pointercancel', function(){ down = false; });

    api.play.innerHTML = '';
    api.play.appendChild(wrap);
  }
  round();
};

/* ---------- boot ---------- */
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('pointerdown', function unlock(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ if(!ac) ac = new AC(); if(ac.state === 'suspended') ac.resume(); }
  }catch(e){}
  document.removeEventListener('pointerdown', unlock, true);
}, true);

var booted = false;
function boot(data){
  if(booted) return;
  booted = true;
  if(data && data.player) setPlayerQuietly(data.player);
  if(state.player) renderHome(); else renderPicker();
}
try{
  if(window.claude && window.claude.hot){
    if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {player:state.player}; });
    if(window.claude.hot.ready) window.claude.hot.ready(boot);
    else boot(window.claude.hot.data || {});
  } else boot({});
}catch(e){ boot({}); }
})();
</script>

.wall-empty{grid-column:1/-1; text-align:center; font-size:56px; opacity:.35; padding:30px 0}
.frame{border:0; padding:9px; border-radius:7px; cursor:pointer;
  background:linear-gradient(145deg,#EFC673,#B8822B 60%,#8E6220);

.frame:nth-child(odd){transform:rotate(-1.6deg)}
.frame:nth-child(even){transform:rotate(1.3deg)}

.bigframe{width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; align-items:center}

/* the Kid Pix eraser */
@keyframes boomshake{
  0%,100%{transform:translate(0,0) rotate(0)}
  15%{transform:translate(-7px,4px) rotate(-1deg)}
  30%{transform:translate(7px,-4px) rotate(1deg)}
  45%{transform:translate(-6px,-3px) rotate(-1deg)}
  65%{transform:translate(6px,3px) rotate(1deg)}

/* mancala */

/* hold a pit to see how many are in it */
.count{position:absolute; inset:0; display:grid; place-items:center; border-radius:50%;

  opacity:0; transition:opacity .12s ease; pointer-events:none}

/* 1, 2, 3… as each rock lands */
.tally{position:absolute; top:-9px; right:-7px; min-width:27px; height:27px; padding:0 6px; border-radius:14px;
  background:var(--sun); color:#1B2435; font-size:15px; font-weight:800; display:grid; place-items:center;
  box-shadow:0 2px 0 rgba(0,0,0,.4); animation:tallypop .24s ease-out; z-index:3}

.rocks{display:flex; flex-wrap:wrap; gap:3px; justify-content:center; align-items:center; max-width:82%}
.rocks.many{gap:2px}
.rock{width:11px; height:11px; border-radius:50%; background:#8A5A3B; box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}

<script>
/* The service worker is what makes this work in airplane mode. It is cache
   first, so without the listener below a device keeps showing the version it
   cached and only picks up a new one on the NEXT launch. With it, the moment a
   new worker takes over, the page reloads itself and the update is simply there. */
if('serviceWorker' in navigator){
  var hadWorker = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadWorker || reloading) return;   /* first ever install: nothing to refresh */
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 30 * 60 * 1000);
    }).catch(function(){});
  });
}
</script>
